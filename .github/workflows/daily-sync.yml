# Đồng bộ giá hằng ngày cho mọi mã đã có trong DB.
#
# Vì sao dùng GitHub Actions thay vì scheduler trong backend: Render gói
# miễn phí cho service "ngủ" sau 15 phút không có traffic nên APScheduler
# (RUN_SCHEDULER=true) không chạy được job nền — xem README mục Deploy.
# Actions gọi HTTP từ ngoài vào nên vừa đánh thức service vừa kích hoạt
# sync, không tốn phí (repo public = free minutes).
#
# Không gọi POST /sync-defaults (chỉ 10 mã cứng) mà lặp qua GET /api/stocks
# để phủ hết mã đã sync — mỗi request ngắn, mã nào lỗi thì bỏ qua mã đó
# thay vì hỏng cả lượt.
name: Đồng bộ giá hằng ngày

on:
  schedule:
    # 09:00 UTC = 16:00 giờ VN, T2-T6 — sau khi HOSE đóng cửa (15:00).
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
    inputs:
      source:
        description: "Nguồn danh sách mã"
        type: choice
        options: ["hose", "db"]
        default: "hose"
      years:
        description: "Số năm dữ liệu lấy về mỗi mã (1 đủ cho cập nhật hằng ngày; đặt 5 khi cần backfill mã mới)"
        default: "1"
      delay:
        description: >-
          Nghỉ bao nhiêu giây giữa 2 mã. vnstock TỰ giới hạn 20
          request/phút phía client rồi (xem vnstock_adapter.py) — sleep
          thêm không giúp né chặn IP, chỉ tốn thời gian job. Mặc định 0;
          chỉnh tay khi provider siết thêm giới hạn.
        default: "0"

concurrency:
  # CHUNG group với backfill-symbols.yml (không phải "daily-sync" riêng):
  # cả 2 file cùng tiêu vào trần 20 request/phút của MỘT tiến trình
  # Render duy nhất (xem vnstock_adapter.py). Chạy chồng nhau là cả hai
  # cùng dính sys.exit() giữa chừng và mất mã âm thầm.
  group: vnstock-sync
  cancel-in-progress: false

env:
  API_BASE_URL: https://stock1122.onrender.com

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Đánh thức backend (Render free tier ngủ sau 15 phút)
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 120 "$API_BASE_URL/api/health" > /dev/null; then
              echo "Backend đã sẵn sàng (lần thử $i)."
              exit 0
            fi
            echo "Chưa dậy, thử lại sau 15s (lần $i/10)..."
            sleep 15
          done
          echo "::error::Backend không phản hồi sau 10 lần thử."
          exit 1

      - name: Đồng bộ chỉ số thị trường (VN-Index, HNX, UPCoM, VN30)
        env:
          YEARS: ${{ inputs.years || '1' }}
        run: |
          curl -fsS --max-time 180 -X POST \
            "$API_BASE_URL/api/market/indices/sync?years=$YEARS" | tee indices-sync.json
          echo "" # curl output không có newline cuối, xuống dòng cho log dễ đọc

      - name: Lấy danh sách mã cần đồng bộ
        run: |
          # Nguồn mặc định là danh sách HOSE đầy đủ (~400 mã) chứ KHÔNG
          # phải bảng `stocks` — bảng đó chỉ chứa mã đã sync được ít nhất
          # 1 lần, nên nếu lấy từ đó thì mã mới niêm yết và mã từng lỗi sẽ
          # không bao giờ được thử lại. Chạy lại hằng ngày trên danh sách
          # đầy đủ khiến job tự vá: mã hôm nay lỗi mai sẽ thử lại.
          if [ "$SOURCE" = "hose" ] \
             && curl -fsS --max-time 120 "$API_BASE_URL/api/stocks/symbols?exchange=HOSE" \
                  | jq -r '.[].symbol' > symbols.txt \
             && [ -s symbols.txt ]; then
            echo "Nguồn: danh sách HOSE đầy đủ."
          else
            echo "Nguồn: bảng stocks (danh sách HOSE không lấy được hoặc SOURCE=db)."
            curl -fsS --max-time 120 "$API_BASE_URL/api/stocks?limit=100000" \
              | jq -r '.items[].symbol' > symbols.txt
          fi
          echo "Sẽ đồng bộ $(wc -l < symbols.txt) mã."
        env:
          SOURCE: ${{ inputs.source || 'hose' }}

      - name: Đồng bộ từng mã
        env:
          YEARS: ${{ inputs.years || '1' }}
          DELAY: ${{ inputs.delay || '0' }}
        run: |
          total=$(wc -l < symbols.txt)
          ok=0; failed=0; i=0
          : > failures.txt
          while read -r symbol; do
            i=$((i + 1))
            if curl -fsS --max-time 180 -X POST \
                 "$API_BASE_URL/api/stocks/$symbol/sync?years=$YEARS" > /dev/null; then
              ok=$((ok + 1))
              echo "[$i/$total] $symbol OK"
            else
              failed=$((failed + 1))
              echo "$symbol" >> failures.txt
              echo "[$i/$total] $symbol LỖI"
            fi
            [ "$DELAY" != "0" ] && sleep "$DELAY"
          done < symbols.txt

          {
            echo "## Kết quả đồng bộ"
            echo ""
            echo "- Thành công: **$ok** / $total"
            echo "- Lỗi: **$failed**"
            if [ "$failed" -gt 0 ]; then
              echo ""
              echo "<details><summary>Mã bị lỗi</summary>"
              echo ""
              echo '```'
              cat failures.txt
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Chỉ báo hỏng cả lượt khi KHÔNG mã nào sync được — vài mã lỗi
          # lẻ tẻ (mã mới niêm yết, tạm ngừng giao dịch) là bình thường.
          if [ "$ok" -eq 0 ]; then
            echo "::error::Không mã nào đồng bộ được."
            exit 1
          fi
