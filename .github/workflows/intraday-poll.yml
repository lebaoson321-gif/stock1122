# Poll giá khớp trong phiên, để mua/bán ảo khớp theo giá đang chạy chứ
# không phải giá đóng cửa hôm trước.
#
# GIỚI HẠN THẬT CẦN BIẾT: GitHub Actions không đảm bảo đúng giờ — lịch
# cron ở đây là "sớm nhất có thể", lúc hệ thống bận có thể trễ vài phút
# hoặc bỏ qua hẳn một nhịp. Vậy nên độ trễ dữ liệu thực tế dao động
# khoảng 5-20 phút, KHÔNG đạt mức "trễ dưới 5 phút" của bảng giá chuyên
# nghiệp. Muốn chặt hơn thì phải chạy tiến trình poll liên tục trên máy
# chủ trả phí (RUN_SCHEDULER=true, xem apps/api/README.md).
name: Poll giá trong phiên

on:
  schedule:
    # Chỉ chạy trong lúc thực sự có khớp lệnh (giờ VN = UTC+7):
    #   phiên sáng  09:00-11:30 VN = 02:00-04:30 UTC
    #   phiên chiều 13:00-14:45 VN = 06:00-07:45 UTC
    # Bỏ hẳn khung nghỉ trưa 11:30-13:00 — giá đứng yên, poll chỉ tốn
    # request và tăng nguy cơ bị VCI chặn. Backend cũng tự chặn lần nữa
    # theo giờ thật (routers/sync.py), nên cron chạy trễ cũng không gọi
    # provider ngoài giờ.
    - cron: "*/10 2-3 * * 1-5"
    # 04:25 UTC = 11:25 VN là nhịp cuối phiên sáng; 04:30 sẽ rơi đúng
    # 11:30 tức lúc nghỉ trưa bắt đầu, backend từ chối nên chỉ tốn 1 lần chạy.
    - cron: "0,10,20,25 4 * * 1-5"
    - cron: "*/10 6 * * 1-5"
    - cron: "0,10,20,30,40 7 * * 1-5"
  workflow_dispatch:

concurrency:
  group: intraday-poll
  # Nhịp sau không cần xếp hàng chờ nhịp trước: dữ liệu mới luôn thay thế
  # dữ liệu cũ, chạy chồng chỉ tổ tốn thời gian.
  cancel-in-progress: true

env:
  API_BASE_URL: https://stock1122.onrender.com

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Poll bảng giá
        run: |
          # Render gói miễn phí ngủ sau 15 phút; nhịp poll 10 phút thường
          # giữ service luôn thức, nhưng nhịp đầu phiên vẫn có thể gặp
          # service đang ngủ nên cho timeout rộng.
          response=$(curl -sS --max-time 300 -w '\n%{http_code}' \
            -X POST "$API_BASE_URL/api/stocks/poll-realtime")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)

          echo "HTTP $code"
          echo "$body"

          if [ "$code" != "200" ]; then
            echo "::error::Poll thất bại (HTTP $code)."
            exit 1
          fi

          echo "$body" | jq -r '"Đã ghi \(.rows_synced) bản ghi cho \(.symbols_requested) mã (\(.failed_batches) lô lỗi)."' \
            >> "$GITHUB_STEP_SUMMARY"
